name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run native Rust tests
        run: cargo test --workspace

      - name: Run Rust Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  viewer-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/package-lock.json
            apps/dev-viewer/package-lock.json

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install root dependencies
        run: npm ci

      - name: Install adapter dependencies
        run: npm ci --prefix packages

      - name: Install viewer dependencies
        run: npm ci --prefix apps/dev-viewer

      - name: Check repository diff
        run: git diff --check

      - name: Type check adapter and viewer
        run: |
          npm --prefix packages run typecheck
          npm --prefix apps/dev-viewer run typecheck

      - name: Prepare Rust/WASM asset
        run: npm --prefix packages run prepare-copc-adapter-wasm

      - name: Download sample dataset
        run: npm run download-samples -- autzen

      - name: Run full Node suite with coverage
        run: |
          npm --prefix packages run coverage:raw
          npm --prefix apps/dev-viewer run test:unit

      - name: Build package and development viewer
        run: |
          npm --prefix packages run build:library:ci
          npm --prefix apps/dev-viewer run build:ci

  viewer-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Separate isolated runners: keep Playwright workers=1 per WebGL process.
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        shard: [1, 2, 3]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/package-lock.json
            apps/dev-viewer/package-lock.json

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install root dependencies
        run: npm ci

      - name: Install adapter dependencies
        run: npm ci --prefix packages

      - name: Install viewer dependencies
        run: npm ci --prefix apps/dev-viewer

      - name: Prepare Rust/WASM asset
        run: npm --prefix packages run prepare-copc-adapter-wasm

      - name: Download sample dataset
        run: npm run download-samples -- autzen

      - name: Install Chromium for browser validation
        run: npx --prefix apps/dev-viewer playwright install --with-deps chromium

      - name: Run browser E2E regression gate
        env:
          COPC_ADAPTER_WASM_PREPARED: '1'
        run: npm --prefix apps/dev-viewer run test:e2e -- --shard=${{ matrix.shard }}/3

  viewer-package:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/package-lock.json
            apps/dev-viewer/package-lock.json

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install root dependencies
        run: npm ci

      - name: Install adapter dependencies
        run: npm ci --prefix packages

      - name: Install viewer dependencies
        run: npm ci --prefix apps/dev-viewer

      - name: Prepare Rust/WASM asset
        run: npm --prefix packages run prepare-copc-adapter-wasm

      - name: Download sample dataset
        run: npm run download-samples -- autzen

      - name: Build and pack one library candidate
        run: |
          rm -rf .ci-artifacts
          mkdir -p .ci-artifacts
          npm --prefix packages run build:library:ci
          npm pack ./packages --ignore-scripts --pack-destination .ci-artifacts

          candidates=()
          while IFS= read -r candidate; do
            candidates+=("$candidate")
          done < <(find .ci-artifacts -maxdepth 1 -type f -name '*.tgz' -print)

          if [ "${#candidates[@]}" -ne 1 ]; then
            printf 'Expected exactly one candidate tarball, found %s\n' "${#candidates[@]}"
            exit 1
          fi

          printf 'PACKAGE_CANDIDATE=%s\n' "${candidates[0]}" >> "$GITHUB_ENV"

      - name: Run packed Cesium consumer validation
        run: node scripts/pack-smoke-test.mjs "$PACKAGE_CANDIDATE"

      - name: Run packed Three.js artifact smoke test
        run: node scripts/pack-three-smoke-test.mjs "$PACKAGE_CANDIDATE"

  # Preserve the existing required status-check name from the main ruleset.
  # A failure (or skipped/cancelled gate) must never appear as a green viewer-web check.
  viewer-web:
    needs: [viewer-fast, viewer-browser, viewer-package]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every viewer validation gate
        env:
          FAST_RESULT: ${{ needs.viewer-fast.result }}
          BROWSER_RESULT: ${{ needs.viewer-browser.result }}
          PACKAGE_RESULT: ${{ needs.viewer-package.result }}
        run: |
          for result in "$FAST_RESULT" "$BROWSER_RESULT" "$PACKAGE_RESULT"; do
            if [ "$result" != "success" ]; then
              echo "::error::All viewer gates must succeed (fast=$FAST_RESULT, browser=$BROWSER_RESULT, package=$PACKAGE_RESULT)"
              exit 1
            fi
          done
