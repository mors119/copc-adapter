name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run native Rust tests
        run: cargo test --workspace

      - name: Run Rust Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  viewer-web:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/viewer-web/package-lock.json

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install root dependencies
        run: npm ci

      - name: Install viewer dependencies
        run: npm ci --prefix apps/viewer-web

      - name: Check repository diff
        run: git diff --check

      - name: Type check viewer
        run: npm --prefix apps/viewer-web run typecheck

      - name: Prepare Rust/WASM asset
        run: npm --prefix apps/viewer-web run prepare-copc-wasm

      - name: Download sample dataset
        run: npm run download-samples -- autzen

      - name: Run full Node suite with coverage
        run: npm --prefix apps/viewer-web run coverage:raw

      - name: Build production bundle
        run: npm --prefix apps/viewer-web run build:ci

      - name: Install Chromium for browser validation
        run: npx --prefix apps/viewer-web playwright install --with-deps chromium

      - name: Run browser E2E regression gate
        run: npm --prefix apps/viewer-web run test:e2e

      - name: Build and pack one library candidate
        run: |
          rm -rf .ci-artifacts
          mkdir -p .ci-artifacts
          npm --prefix apps/viewer-web run build:library:ci
          npm pack ./apps/viewer-web --ignore-scripts --pack-destination .ci-artifacts

          candidates=()
          while IFS= read -r candidate; do
            candidates+=("$candidate")
          done < <(find .ci-artifacts -maxdepth 1 -type f -name '*.tgz' -print)

          if [ "${#candidates[@]}" -ne 1 ]; then
            printf 'Expected exactly one candidate tarball, found %s\n' "${#candidates[@]}"
            exit 1
          fi

          printf 'PACKAGE_CANDIDATE=%s\n' "${candidates[0]}" >> "$GITHUB_ENV"

      - name: Run packed Cesium consumer validation
        run: node scripts/pack-smoke-test.mjs "$PACKAGE_CANDIDATE"

      - name: Run packed Three.js artifact smoke test
        run: node scripts/pack-three-smoke-test.mjs "$PACKAGE_CANDIDATE"
