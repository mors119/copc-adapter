name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Cancel superseded PR runs, but never interrupt main branch verification.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Cheap assertions must run before any WebGL, WASM, npm packaging, or Rust jobs.
  # This catches stale package contracts in seconds rather than after a full Tiles verify.
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Verify npm Workspace manifests and package lock
        run: node packages/tiles/scripts/test-migration-staging.mjs --preflight
  rust:
    needs: [preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run native Rust tests
        run: cargo test --workspace

      - name: Run Rust Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  viewer-fast:
    needs: [preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/dev-viewer/package-lock.json

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install root dependencies
        run: npm ci

      - name: Install viewer dependencies
        run: npm ci --prefix apps/dev-viewer --workspaces=false

      - name: Check repository diff
        run: git diff --check

      - name: Type check adapter and viewer
        run: |
          npm run typecheck -w @frillab/copc-adapter
          npm --prefix apps/dev-viewer run typecheck

      - name: Prepare Rust/WASM asset
        run: npm run prepare-copc-adapter-wasm -w @frillab/copc-adapter

      - name: Download sample dataset
        run: npm run download-samples -- autzen

      - name: Run full Node suite with coverage
        run: |
          npm run coverage:raw -w @frillab/copc-adapter
          npm --prefix apps/dev-viewer run test:unit

      - name: Build package and development viewer
        run: |
          npm run build:library:ci -w @frillab/copc-adapter
          npm --prefix apps/dev-viewer run build:ci

  viewer-browser:
    needs: [preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Test-level shards spread large spec files across isolated runners while
    # keeping Playwright workers=1 per WebGL process.
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/dev-viewer/package-lock.json

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json', 'apps/dev-viewer/package-lock.json') }}
          restore-keys: ${{ runner.os }}-playwright-

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install root dependencies
        run: npm ci

      - name: Install viewer dependencies
        run: npm ci --prefix apps/dev-viewer --workspaces=false

      - name: Prepare Rust/WASM asset
        run: npm run prepare-copc-adapter-wasm -w @frillab/copc-adapter

      - name: Download sample dataset
        run: npm run download-samples -- autzen

      - name: Install Chromium for browser validation
        run: npx --prefix apps/dev-viewer playwright install --with-deps chromium

      - name: Run browser E2E regression gate
        env:
          COPC_ADAPTER_WASM_PREPARED: '1'
        run: npm --prefix apps/dev-viewer run test:e2e -- --shard=${{ matrix.shard }}/4

      - name: Upload browser test timing report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-report-${{ matrix.shard }}
          path: apps/dev-viewer/test-results/results.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload sanitized browser failure summaries
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-failure-diagnostics-${{ matrix.shard }}
          path: apps/dev-viewer/test-results/ci-diagnostics/*.json
          if-no-files-found: ignore
          retention-days: 7

  viewer-package:
    needs: [preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      package_sha256: ${{ steps.pack.outputs.package_sha256 }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/dev-viewer/package-lock.json

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json', 'apps/dev-viewer/package-lock.json') }}
          restore-keys: ${{ runner.os }}-playwright-

      - name: Install root dependencies
        run: npm ci

      - name: Install viewer dependencies
        run: npm ci --prefix apps/dev-viewer --workspaces=false

      - name: Install Chromium for packed Three validation
        run: npx --prefix apps/dev-viewer playwright install --with-deps chromium

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Prepare Rust/WASM asset
        run: npm run prepare-copc-adapter-wasm -w @frillab/copc-adapter

      - name: Build and pack one library candidate
        id: pack
        run: |
          rm -rf ci-artifacts
          mkdir -p ci-artifacts
          npm run build:library:ci -w @frillab/copc-adapter
          npm pack ./packages/adapter --ignore-scripts --pack-destination ci-artifacts

          candidates=()
          while IFS= read -r candidate; do
            candidates+=("$candidate")
          done < <(find ci-artifacts -maxdepth 1 -type f -name '*.tgz' -print)

          if [ "${#candidates[@]}" -ne 1 ]; then
            printf 'Expected exactly one candidate tarball, found %s\n' "${#candidates[@]}"
            exit 1
          fi

          printf 'PACKAGE_CANDIDATE=%s\n' "${candidates[0]}" >> "$GITHUB_ENV"
          package_sha256=$(sha256sum "${candidates[0]}" | cut -d ' ' -f 1)
          printf 'package_sha256=%s\n' "$package_sha256" >> "$GITHUB_OUTPUT"

      - name: Download sample dataset
        run: npm run download-samples -- autzen

      - name: Run packed Three.js artifact smoke test
        run: node scripts/pack-three-smoke-test.mjs "$PACKAGE_CANDIDATE"

      - name: Run renderer-free strict NodeNext Core consumer test
        run: node scripts/pack-core-smoke-test.mjs "$PACKAGE_CANDIDATE"

      - name: Upload verified package candidate
        uses: actions/upload-artifact@v7
        with:
          name: copc-adapter-package-candidate
          path: ci-artifacts/*.tgz
          if-no-files-found: error
          retention-days: 1

  viewer-package-consumer:
    needs: [viewer-package]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        consumer: [root-prod, cesium-prod, root-dev]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-playwright-

      - name: Install root dependencies
        run: npm ci

      - name: Download sample dataset
        run: npm run download-samples -- autzen

      - name: Download verified package candidate
        uses: actions/download-artifact@v8
        with:
          name: copc-adapter-package-candidate
          path: ci-artifacts

      - name: Verify package identity
        env:
          EXPECTED_PACKAGE_SHA256: ${{ needs.viewer-package.outputs.package_sha256 }}
        run: |
          set -euo pipefail
          candidates=()
          while IFS= read -r candidate; do
            candidates+=("$candidate")
          done < <(find ci-artifacts -maxdepth 1 -type f -name '*.tgz' -print)

          if [ "${#candidates[@]}" -ne 1 ]; then
            printf 'Expected exactly one candidate tarball, found %s\n' "${#candidates[@]}"
            exit 1
          fi

          actual_package_sha256=$(sha256sum "${candidates[0]}" | cut -d ' ' -f 1)
          if [ "$actual_package_sha256" != "$EXPECTED_PACKAGE_SHA256" ]; then
            echo 'Downloaded package candidate does not match the verified build artifact'
            exit 1
          fi

          printf 'Verified package candidate SHA-256: %s\n' "$actual_package_sha256"
          printf 'PACKAGE_CANDIDATE=%s\n' "${candidates[0]}" >> "$GITHUB_ENV"

      - name: Run isolated packed Cesium consumer mode
        run: node scripts/pack-smoke-test.mjs "$PACKAGE_CANDIDATE" "${{ matrix.consumer }}"

  tiles-package:
    needs: [viewer-package]
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-playwright-

      - name: Install root workspaces
        run: npm ci

      - name: Download verified Adapter package candidate
        uses: actions/download-artifact@v8
        with:
          name: copc-adapter-package-candidate
          path: ci-artifacts

      - name: Provide built Adapter declarations to the workspace
        run: |
          candidates=(ci-artifacts/*.tgz)
          if [ "${#candidates[@]}" -ne 1 ]; then
            printf 'Expected exactly one Adapter tarball, found %s\n' "${#candidates[@]}"
            exit 1
          fi
          tar -xzf "${candidates[0]}" -C packages/adapter --strip-components=1 package/dist
          test -f packages/adapter/dist/core.d.ts

      - name: Install Chromium for Tiles browser fixtures
        run: npm exec --workspace=@frillab/copc-tiles -- playwright install --with-deps chromium

      - name: Typecheck the candidate Adapter and Tiles Core integration
        run: |
          npm run typecheck -w @frillab/copc-adapter
          npm run typecheck -w @frillab/copc-tiles
          npm run typecheck:adapter-core -w @frillab/copc-tiles

      - name: Verify Tiles from a clean independent workspace
        run: npm run verify -w @frillab/copc-tiles

      - name: Audit runtime dependencies
        run: npm audit --omit=dev

  # Preserve the existing required status-check name from the main ruleset.
  # A failure (or skipped/cancelled gate) must never appear as a green viewer-web check.
  viewer-web:
    needs: [preflight, viewer-fast, viewer-browser, viewer-package, viewer-package-consumer, tiles-package]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every viewer validation gate
        env:
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          FAST_RESULT: ${{ needs.viewer-fast.result }}
          BROWSER_RESULT: ${{ needs.viewer-browser.result }}
          PACKAGE_BUILD_RESULT: ${{ needs.viewer-package.result }}
          PACKAGE_CONSUMER_RESULT: ${{ needs.viewer-package-consumer.result }}
          TILES_RESULT: ${{ needs.tiles-package.result }}
        run: |
          for result in "$PREFLIGHT_RESULT" "$FAST_RESULT" "$BROWSER_RESULT" "$PACKAGE_BUILD_RESULT" "$PACKAGE_CONSUMER_RESULT" "$TILES_RESULT"; do
            if [ "$result" != "success" ]; then
              echo "::error::All validation gates must succeed (preflight=$PREFLIGHT_RESULT, fast=$FAST_RESULT, browser=$BROWSER_RESULT, package-build=$PACKAGE_BUILD_RESULT, package-consumers=$PACKAGE_CONSUMER_RESULT, tiles=$TILES_RESULT)"
              exit 1
            fi
          done
