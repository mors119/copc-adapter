name: GitHub Pages

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'apps/playground/**'
      - 'apps/shared/**'
      - 'packages/adapter/**'
      - 'scripts/assemble-pages.mjs'
      - 'scripts/assert-pages-layout.mjs'
      - 'scripts/assert-playground-release.mjs'
      - 'scripts/build-pages.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/docs-pages.yml'
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'apps/playground/**'
      - 'apps/shared/**'
      - 'packages/adapter/**'
      - 'scripts/assemble-pages.mjs'
      - 'scripts/assert-pages-layout.mjs'
      - 'scripts/assert-playground-release.mjs'
      - 'scripts/build-pages.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/docs-pages.yml'
  workflow_dispatch:

permissions: {}

# PRs must not wait behind unrelated PR Pages builds, or cancel main deployment.
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  preflight:
    name: Workspace manifest preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_playground_e2e: ${{ steps.scope.outputs.run_playground_e2e }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Decide whether Playground browser validation is needed
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" || -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            run_playground_e2e=true
          else
            if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
              git fetch --no-tags --depth=1 origin "$BASE_SHA" || true
            fi
            if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
              run_playground_e2e=true
            else
              changed_paths=$(git diff --name-only --no-renames "$BASE_SHA" "$HEAD_SHA")
              if [[ -z "$changed_paths" ]] || grep -qv '^docs/' <<< "$changed_paths"; then
                run_playground_e2e=true
              else
                run_playground_e2e=false
              fi
            fi
          fi
          echo "run_playground_e2e=$run_playground_e2e" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Verify Adapter workspace and lockfiles
        run: node scripts/verify-adapter-workspace.mjs

  build:
    name: Build complete Pages site
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/playground/package-lock.json

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json', 'apps/playground/package-lock.json') }}
          restore-keys: ${{ runner.os }}-playwright-

      - name: Install root dependencies
        run: npm ci

      - name: Install Playground build dependencies
        run: npm ci --prefix apps/playground --workspaces=false

      - name: Test released package provenance gate
        run: npm --prefix apps/playground run test:provenance

      - name: Verify exact published npm Playground dependency
        run: npm run playground:verify-release

      - name: Download the COPC fixture for Playground browser tests
        if: needs.preflight.outputs.run_playground_e2e == 'true'
        run: npm run download-samples -- autzen

      - name: Install Chromium for Playground browser tests
        if: needs.preflight.outputs.run_playground_e2e == 'true'
        run: npx --prefix apps/playground playwright install --with-deps chromium

      - name: Test Playground browser interactions
        if: needs.preflight.outputs.run_playground_e2e == 'true'
        run: npm --prefix apps/playground run test:e2e

      - name: Upload Playground browser traces
        if: failure() && needs.preflight.outputs.run_playground_e2e == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: playground-playwright-results
          path: apps/playground/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Build and validate complete site
        run: npm run pages:build

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6

      - name: Upload complete Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: .ci-artifacts/pages-dist

  deploy:
    name: Deploy complete Pages site
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
