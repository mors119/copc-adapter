name: GitHub Pages

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'apps/playground/**'
      - 'apps/shared/**'
      - 'packages/**'
      - 'packages/scripts/build-copc-adapter-wasm.mjs'
      - 'packages/scripts/finalize-library-assets.mjs'
      - 'packages/package.json'
      - 'packages/package-lock.json'
      - 'packages/vite.lib.config.ts'
      - 'packages/tsconfig*.json'
      - 'crates/**'
      - '.cargo/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain*'
      - 'scripts/assemble-pages.mjs'
      - 'scripts/assert-pages-layout.mjs'
      - 'scripts/build-pages.mjs'
      - 'scripts/package-playground-adapter.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/docs-pages.yml'
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'apps/playground/**'
      - 'apps/shared/**'
      - 'packages/**'
      - 'packages/scripts/build-copc-adapter-wasm.mjs'
      - 'packages/scripts/finalize-library-assets.mjs'
      - 'packages/package.json'
      - 'packages/package-lock.json'
      - 'packages/vite.lib.config.ts'
      - 'packages/tsconfig*.json'
      - 'crates/**'
      - '.cargo/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain*'
      - 'scripts/assemble-pages.mjs'
      - 'scripts/assert-pages-layout.mjs'
      - 'scripts/build-pages.mjs'
      - 'scripts/package-playground-adapter.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/docs-pages.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build complete Pages site
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/package-lock.json
            apps/playground/package-lock.json

      - name: Setup Rust WASM target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install root dependencies
        run: npm ci

      - name: Install adapter build dependencies
        run: npm ci --prefix packages

      - name: Install Playground build dependencies
        run: npm ci --prefix apps/playground

      - name: Install Chromium for Playground browser tests
        run: npx --prefix apps/playground playwright install --with-deps chromium

      - name: Test Playground browser interactions
        run: |
          npm run playground:package
          npm --prefix apps/playground run test:e2e

      - name: Build and validate complete site
        run: npm run pages:build

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6

      - name: Upload complete Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: .ci-artifacts/pages-dist

  deploy:
    name: Deploy complete Pages site
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
