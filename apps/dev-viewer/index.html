<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>COPC Adapter Dev Viewer</title>
  </head>
  <body>
    <main class="dev-workbench" aria-label="COPC Adapter development viewer">
      <div id="cesium-container" aria-label="Interactive COPC point cloud viewport"></div>

      <button
        class="dev-panel-toggle dev-panel-toggle--left"
        id="controls-toggle"
        type="button"
        aria-controls="controls-panel"
        aria-expanded="true"
        aria-label="Collapse controls panel"
        title="Collapse controls panel"
      ><span aria-hidden="true">‹</span></button>
      <aside class="dev-panel dev-panel--left" id="controls-panel" aria-label="Viewer controls">
        <header class="dev-panel__header">
          <h2>Controls</h2>
        </header>
        <div class="dev-panel__content">
          <details class="dev-control-section" open>
            <summary>Source</summary>
            <label class="ui-field" for="source-selection">Dataset
              <select id="source-selection">
                <option value="local-autzen">Autzen · local fixture</option>
                <option value="autzen-remote">Autzen · public HTTP</option>
                <option value="chicago-remote">Chicago · public HTTP</option>
                <option value="custom">Custom HTTP URL</option>
              </select>
            </label>
            <label class="ui-field" for="custom-source-url">COPC URL
              <input id="custom-source-url" type="url" placeholder="https://host.example/area.copc.laz" disabled>
            </label>
            <button class="dev-action" id="load-source" type="button">Probe and load source</button>
            <label class="dev-file" for="local-source-file">Open local COPC file
              <input id="local-source-file" type="file" accept=".copc.laz,.laz,.copc,application/octet-stream">
            </label>
          </details>

          <details class="dev-control-section" open>
            <summary>Renderer and Backend</summary>
            <span class="control-label">Renderer</span><div id="renderer-control"></div>
            <span class="control-label">Backend</span><div id="backend-control"></div>
          </details>

          <details class="dev-control-section" open>
            <summary>Camera presets</summary>
            <div id="camera-control"></div>
          </details>

          <details class="dev-control-section" open>
            <summary>Appearance</summary>
            <span class="control-label">Color mode</span><div id="color-control"></div>
            <div class="control-slider" id="point-size-control"></div>
          </details>

          <details class="dev-control-section" open>
            <summary>Streaming</summary>
            <div class="control-slider" id="max-nodes-control"></div>
            <div class="control-slider" id="max-points-control"></div>
          </details>

          <details class="dev-control-section dev-advanced-settings">
            <summary>Advanced settings</summary>
            <label class="ui-field" for="max-depth">Max depth<input id="max-depth" type="number" min="1" max="24" step="1"></label>
            <label class="ui-field" for="max-sse">Screen-space error (px)<input id="max-sse" type="number" min="1" max="128" step="0.5"></label>
            <label class="ui-field" for="camera-render-distance">Camera distance (m)<input id="camera-render-distance" type="number" min="1" step="1"></label>
            <label class="ui-field" for="max-render-distance">Max render distance (m)<input id="max-render-distance" type="number" min="1" step="1"></label>
            <button class="dev-action dev-action--secondary" id="apply-advanced" type="button">Apply advanced settings</button>
            <button class="dev-action dev-action--secondary" id="reload-renderer" type="button">Reload renderer</button>
          </details>
        </div>
      </aside>

      <span class="dev-version" id="package-version" aria-label="Workspace adapter version"></span>
      <button
        class="dev-panel-toggle dev-panel-toggle--right"
        id="inspector-toggle"
        type="button"
        aria-controls="inspector-panel"
        aria-expanded="true"
        aria-label="Collapse inspector panel"
        title="Collapse inspector panel"
      ><span aria-hidden="true">›</span></button>
      <aside class="dev-panel dev-panel--right copc-debug-panel" id="inspector-panel" aria-label="COPC runtime debug panel">
        <div class="dev-panel__header">
          <h2>Inspector</h2>
        </div>
        <div class="dev-panel__content" id="inspector-content"></div>
      </aside>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
