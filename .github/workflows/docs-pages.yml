name: GitHub Pages

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'apps/playground/**'
      - 'apps/shared/**'
      - 'packages/adapter/**'
      - 'packages/tiles/**'
      - 'scripts/assemble-pages.mjs'
      - 'scripts/assert-pages-layout.mjs'
      - 'scripts/assert-playground-release.mjs'
      - 'scripts/build-pages.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/docs-pages.yml'
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'apps/playground/**'
      - 'apps/shared/**'
      - 'packages/adapter/**'
      - 'packages/tiles/**'
      - 'scripts/assemble-pages.mjs'
      - 'scripts/assert-pages-layout.mjs'
      - 'scripts/assert-playground-release.mjs'
      - 'scripts/build-pages.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/docs-pages.yml'
  workflow_dispatch:

permissions: {}

# PRs must not wait behind unrelated PR Pages builds, or cancel main deployment.
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  preflight:
    name: Workspace manifest preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Verify workspaces before browser and install steps
        run: node packages/tiles/scripts/test-migration-staging.mjs --preflight

  build:
    name: Build complete Pages site
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/playground/package-lock.json

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json', 'apps/playground/package-lock.json') }}
          restore-keys: ${{ runner.os }}-playwright-

      - name: Install root dependencies
        run: npm ci

      - name: Install Playground build dependencies
        run: npm ci --prefix apps/playground --workspaces=false

      - name: Test released package provenance gate
        run: npm --prefix apps/playground run test:provenance

      - name: Verify exact published npm Playground dependency
        run: npm run playground:verify-release

      - name: Install Chromium for Playground browser tests
        run: npx --prefix apps/playground playwright install --with-deps chromium

      - name: Test Playground browser interactions
        run: npm --prefix apps/playground run test:e2e

      - name: Build and validate complete site
        run: npm run pages:build

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6

      - name: Upload complete Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: .ci-artifacts/pages-dist

  deploy:
    name: Deploy complete Pages site
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
