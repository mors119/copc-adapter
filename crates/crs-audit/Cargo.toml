[package]
name = "crs-audit"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "crs-audit"
path = "src/main.rs"

[dependencies]
proj4rs = { version = "0.1.10", default-features = false, features = ["wasm-strict"] }
proj4wkt = { version = "0.1.1", default-features = false, features = ["wasm-strict"] }
serde = { version = "1.0.205", features = ["derive"] }
serde_json = "1.0.122"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "=0.2.126"
