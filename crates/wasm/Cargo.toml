[package]
name = "copc-adapter-wasm"
version = "0.5.1"
edition = "2024"
description = "WebAssembly adapter for COPC Adapter's Rust core."
license = "Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
copc-adapter-core = { path = "../core", version = "0.5.1" }
serde = { version = "1.0.205", features = ["derive"] }
serde_json = "1.0.122"
