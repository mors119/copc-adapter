[package]
name = "copc-adapter-core"
version = "0.5.2"
edition = "2024"
description = "Pure Rust COPC parsing, LAZ decoding, and point preparation core."
license = "Apache-2.0"

[dependencies]
laz = "0.13.0"
proj4rs = { version = "0.2.0", default-features = false, features = ["wasm-strict"] }
proj4wkt = { version = "0.1.1", default-features = false, features = ["wasm-strict"] }
