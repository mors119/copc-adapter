# The two coverage uploads are emitted by existing jobs, without re-running
# unit tests just for coverage. They do not measure browser E2E or Rust/WASM.
codecov:
  notify:
    after_n_builds: 2

coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

flags:
  adapter-node:
    paths:
      - packages/adapter/
    carryforward: false
  rust-native:
    paths:
      - crates/
    carryforward: false

component_management:
  individual_components:
    - component_id: adapter-core
      name: Adapter Core
      paths:
        - packages/adapter/core/**
        - packages/adapter/core.ts
        - packages/adapter/index.ts
    - component_id: adapter-cesium
      name: Adapter CesiumJS
      paths:
        - packages/adapter/cesium/**
        - packages/adapter/cesium.ts
    - component_id: adapter-three
      name: Adapter Three.js
      paths:
        - packages/adapter/three/**
        - packages/adapter/three.ts
    - component_id: rust-native
      name: Native Rust
      paths:
        - crates/**
